<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>BYTE - Aprenda Word do seu jeito</title>
  <link rel="icon" type="image/x-icon" href="fav.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./css/style-licao.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Bebas+Neue&family=Boldonse&family=Oswald:wght@200..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>



<!-- Topo com barra + menu -->
<div id="topo-interface">
  
  <!-- Barra de progresso -->
  <section id="progress-bar-container" class="barra-progresso-container" aria-label="Progresso do usuário" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <section id="progress-bar" class="barra-progresso" style="width: 100%;"></section>
  </section>

  <!-- Menu lateral -->
  <nav id="navegacao-trilha" aria-label="Navegação lateral">
    <p class="boasvindas-usuario">Usuário</p>

    <div class="dropdown">
      <button class="botao-trilha ativo" id="btnWord">Word</button>
      <div class="dropdown-menu" id="menuWord">
        <button class="dropdown-option" data-opcao="dificuldade">Alterar módulo</button>
        <button class="dropdown-option" data-opcao="curso">Alterar curso</button>
      </div>
    </div>

    <div class="vidas-dropdown">
      <button class="botao-trilha" id="botaoVidas">
        <span class="material-icons">favorite</span>
        <span id="valorVidas">0</span>
      </button>
    </div>

    <div class="pontuacao-dropdown">
      <button class="botao-trilha" id="botaoPontuacao">
        <span class="material-icons">pets</span>
        <span id="valorPontuacao">0</span>
      </button>
    </div>

    <a href="index-word.html" class="botao-trilha" id="botaoSair">Sair</a>
  </nav>
</div>


<main class="pagina-concluida">
<section class="container-concluido">
<figure>
<img src="./img/02.png" alt="Gatinho comemorando a conclusão das lições" class="imagem-concluido" />
</figure>
<h1 class="texto-concluido">Lições concluídas!</h1>

<button id="botaoFinal" class="botao" type="button" onclick="window.location.href='index-word.html'">Continuar</button>

</section>

</main>
</body>
</html>
