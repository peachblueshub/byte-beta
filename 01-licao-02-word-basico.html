    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <title>Lição - Formatações</title>
    <link rel="stylesheet" href="./css/style-01-licao-02-word-basico.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Bebas+Neue&family=Boldonse&family=Oswald:wght@200..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="./css/loading.css">
<script src="./js/loading.js" defer></script>
    <!-- Ícones Google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    </head>
    <body>

<!-- Carregamento -->

<div id="loading-screen">
<img src="./img/30.png" alt="Carregando..." />
<p id="loading-text">Carregando... 0%</p>
<div id="loading-bar-container">
<div id="loading-bar"></div>
</div>
</div>
<!-- Topo com barra + menu -->
<div id="topo-interface">
  
  <!-- Barra de progresso -->
  <section id="progress-bar-container" class="barra-progresso-container" aria-label="Progresso do usuário" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <section id="progress-bar" class="barra-progresso" style="width: 0%;"></section>
  </section>

  <!-- Menu lateral -->
  <nav id="navegacao-trilha" aria-label="Navegação lateral">
    <p class="boasvindas-usuario">Usuário</p>

    <div class="dropdown">
      <button class="botao-trilha ativo" id="btnWord">Word</button>
      <div class="dropdown-menu" id="menuWord">
        <button class="dropdown-option" data-opcao="dificuldade">Alterar módulo</button>
        <button class="dropdown-option" data-opcao="curso">Alterar curso</button>
      </div>
    </div>

    <div class="vidas-dropdown">
      <button class="botao-trilha" id="botaoVidas">
        <span class="material-icons">favorite</span>
        <span id="valorVidas">0</span>
      </button>
    </div>

    <div class="pontuacao-dropdown">
      <button class="botao-trilha" id="botaoPontuacao">
        <span class="material-icons">pets</span>
        <span id="valorPontuacao">0</span>
      </button>
    </div>

    <a href="index-word.html" class="botao-trilha" id="botaoSair">Sair</a>
  </nav>
</div>


    <!-- Jogo -->

    <div id="game-container" role="main">

    <div id="message" aria-live="polite"></div>

    <div id="columns">
    <div class="column" id="icons" role="list" aria-label="Ícones de formatação">
    <button class="option" data-pair="bold" role="listitem" aria-pressed="false"><b>B</b></button>
    <button class="option" data-pair="italic" role="listitem" aria-pressed="false"><i>I</i></button>
    <button class="option" data-pair="underline" role="listitem" aria-pressed="false"><u>S</u></button>
    <button class="option" data-pair="strike" role="listitem" aria-pressed="false"><s>ABC</s></button>
    </div>

    <div class="column" id="descriptions" role="list" aria-label="Descrições das formatações">
    <button class="option" data-pair="strike" role="listitem" aria-pressed="false">Tachado – Adiciona uma linha sobre o texto</button>
    <button class="option" data-pair="italic" role="listitem" aria-pressed="false">Itálico – Inclina levemente o texto</button>
    <button class="option" data-pair="bold" role="listitem" aria-pressed="false">Negrito – Deixa o texto mais escuro e destacado</button>
    <button class="option" data-pair="underline" role="listitem" aria-pressed="false">Sublinhado – Adiciona uma linha abaixo do texto</button>
    </div>
    </div>
    </div>


    <script src="./js/script-01-licao-02-word-basico.js"></script>
    </body>
    </html>
